name: Release Helm Chart

on:
  push:
    branches: [main, dev]
    paths:
      - 'Chart.yaml'
      - 'values.yaml'
      - 'values.schema.json'
      - 'templates/**'
      - '.github/workflows/release-chart.yml'
  workflow_dispatch:
    inputs:
      dev_release:
        type: boolean
        description: 'Force dev-style release (-dev suffix, marked prerelease)'
        required: false
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: latest

      - name: Package chart
        id: package
        run: |
          set -e
          CHART_NAME=$(helm show chart . | awk '/^name:/{print $2}')
          CHART_VERSION=$(helm show chart . | awk '/^version:/{print $2}')

          if [ "${{ github.ref }}" = "refs/heads/dev" ] || [ "${{ github.event.inputs.dev_release }}" = "true" ]; then
            IS_DEV=true
            PACKAGE_VERSION="${CHART_VERSION}-dev"
          else
            IS_DEV=false
            PACKAGE_VERSION="${CHART_VERSION}"
          fi

          mkdir -p /tmp/pkg
          helm package . --version "${PACKAGE_VERSION}" --destination /tmp/pkg

          {
            echo "chart_name=${CHART_NAME}"
            echo "chart_version=${PACKAGE_VERSION}"
            echo "package_file=${CHART_NAME}-${PACKAGE_VERSION}.tgz"
            echo "tag=${CHART_NAME}-${PACKAGE_VERSION}"
            echo "is_dev=${IS_DEV}"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/pkg/${{ steps.package.outputs.package_file }}
          tag_name: ${{ steps.package.outputs.tag }}
          name: ${{ steps.package.outputs.is_dev == 'true' && format('Dev release {0}', steps.package.outputs.chart_version) || format('Release {0}', steps.package.outputs.chart_version) }}
          body: |
            ${{ steps.package.outputs.is_dev == 'true' && '**Dev build** - for testing only.' || '' }}

            ```bash
            helm repo add scion https://breymander.github.io/scion-helm-chart
            helm repo update
            helm install scion scion/scion${{ steps.package.outputs.is_dev == 'true' && format(' --version {0}', steps.package.outputs.chart_version) || '' }}
            ```
          draft: false
          prerelease: ${{ steps.package.outputs.is_dev }}

      # Rebuild index.yaml by merging the new package into the published one.
      # `helm repo index --merge` keeps every previously released version's
      # entry and URL untouched, so the index never depends on re-downloading
      # old release assets.
      - name: Publish index.yaml to gh-pages
        env:
          BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.package.outputs.tag }}
        run: |
          set -e
          git fetch origin gh-pages:gh-pages 2>/dev/null || true
          if git rev-parse --verify gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p docs
          if [ -f docs/index.yaml ]; then
            helm repo index /tmp/pkg --url "${BASE_URL}" --merge docs/index.yaml
          else
            helm repo index /tmp/pkg --url "${BASE_URL}"
          fi
          cp /tmp/pkg/index.yaml docs/index.yaml

          # index.yaml must point at release assets, never at a local path.
          grep -q "releases/download" docs/index.yaml || {
            echo "ERROR: index.yaml has no release URLs"; cat docs/index.yaml; exit 1;
          }

          touch .nojekyll
          git add -f docs/index.yaml .nojekyll
          git commit -m "Publish ${{ steps.package.outputs.chart_name }} ${{ steps.package.outputs.chart_version }} [skip ci]" || true
          git push origin gh-pages

      - name: Push chart to GHCR as an OCI artifact
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push "/tmp/pkg/${{ steps.package.outputs.package_file }}" oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Summary
        run: |
          {
            echo "## Chart released: ${{ steps.package.outputs.chart_version }}"
            echo ""
            echo '```bash'
            echo "helm repo add scion https://breymander.github.io/scion-helm-chart"
            echo "helm repo update"
            echo "helm install scion scion/scion"
            echo '```'
            echo ""
            echo "Also available as OCI: \`oci://ghcr.io/${{ github.repository_owner }}/charts/${{ steps.package.outputs.chart_name }}\`"
          } >> $GITHUB_STEP_SUMMARY
