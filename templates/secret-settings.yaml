{{- if not .Values.config.existingSecret }}
{{- $server := dict
    "mode" "hosted"
    "hub" (dict "hub_id" (required "hub.hubId is required" .Values.hub.hubId) "hub_name" .Values.hub.name)
    "database" (dict
        "driver" .Values.database.driver
        "max_open_conns" (int .Values.database.maxOpenConns)
        "max_idle_conns" (int .Values.database.maxIdleConns)
        "conn_max_lifetime" .Values.database.connMaxLifetime
        "conn_max_idle_time" .Values.database.connMaxIdleTime)
    "storage" (dict "provider" .Values.storage.provider)
    "broker" (dict "auto_provide" true "host" "127.0.0.1" "port" 9800)
-}}
{{- $auth := dict "mode" .Values.auth.mode "user_access_mode" .Values.auth.userAccessMode -}}
{{- with .Values.auth.authorizedDomains }}
{{- $auth = set $auth "authorized_domains" . }}
{{- end }}
{{- if eq .Values.auth.mode "proxy" }}
{{- $auth = set $auth "proxy" (dict "enabled" true "header" .Values.auth.proxy.header "trusted_proxies" .Values.auth.proxy.trustedProxies) }}
{{- end }}
{{- $server = set $server "auth" $auth -}}
{{- with .Values.hub.adminEmails }}
{{- $_ := set (index $server "hub") "admin_emails" . }}
{{- end }}
{{- if eq .Values.auth.mode "oauth" }}
{{- $web := dict }}
{{- with .Values.auth.oauth.github.clientId }}
{{- $web = set $web "github" (dict "client_id" . "client_secret" $.Values.auth.oauth.github.clientSecret) }}
{{- end }}
{{- with .Values.auth.oauth.google.clientId }}
{{- $web = set $web "google" (dict "client_id" . "client_secret" $.Values.auth.oauth.google.clientSecret) }}
{{- end }}
{{- if $web }}
{{- $server = set $server "oauth" (dict "web" $web) }}
{{- end }}
{{- end }}
{{- $runtime := dict
    "type" "kubernetes"
    "namespace" (include "scion.agentNamespace" .)
    "list_all_namespaces" .Values.agents.listAllNamespaces -}}
{{- /*
  Deliberately absent: `gke: true`.

  Upstream's chart writes that key unconditionally, with no value to turn it
  off. It makes the hub resolve agent credentials through Application Default
  Credentials and provision secrets through the GKE Secret Store CSI driver,
  neither of which exists on a self-managed cluster. Omitted here, it defaults
  to false and the hub uses plain Kubernetes Secrets and in-cluster config.
*/ -}}
{{- $doc := dict "schema_version" "1" "active_profile" "default" "profiles" (dict "default" (dict "runtime" "kubernetes")) "runtimes" (dict "kubernetes" $runtime) "server" $server -}}
{{- with .Values.agents.imageRegistry }}
{{- $doc = set $doc "image_registry" . }}
{{- end }}
{{- with .Values.config.extra }}
{{- $doc = mergeOverwrite $doc (deepCopy .) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-settings" (include "scion.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scion.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Rendered by the scion chart. The session secret is NOT here - it arrives as
  # an environment variable from its own Secret.
  settings.yaml: |
{{ toYaml $doc | indent 4 }}
{{- end }}
