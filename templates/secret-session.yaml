{{- if not .Values.auth.existingSecret }}
{{- $name := printf "%s-session" (include "scion.fullname" .) -}}
{{- $key := "SCION_SERVER_SESSION_SECRET" -}}
{{- /*
  Generated once and then preserved. Re-rendering a fresh secret on every
  upgrade would silently sign out every user and invalidate every live session,
  so an existing value is read back out of the cluster rather than replaced.
*/ -}}
{{- $secret := .Values.auth.sessionSecret -}}
{{- if not $secret -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing (index (default dict $existing.data) $key) -}}
{{- $secret = index $existing.data $key | b64dec -}}
{{- else -}}
{{- $secret = randAlphaNum 48 -}}
{{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scion.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ $key }}: {{ $secret | quote }}
{{- end }}
