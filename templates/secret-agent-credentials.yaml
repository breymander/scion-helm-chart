{{- /*
  Model credentials for the agent harnesses. The hub reads these from its own
  process environment and passes them into agent containers, so they are
  injected as env vars rather than written into settings.yaml.
*/ -}}
{{- if and .Values.agents.credentials.create (not .Values.agents.credentials.existingSecret) }}
{{- $data := dict -}}
{{- with .Values.agents.credentials.anthropicApiKey }}{{ $data = set $data "ANTHROPIC_API_KEY" . }}{{ end }}
{{- with .Values.agents.credentials.geminiApiKey }}{{ $data = set $data "GEMINI_API_KEY" . }}{{ end }}
{{- with .Values.agents.credentials.openaiApiKey }}{{ $data = set $data "OPENAI_API_KEY" . }}{{ end }}
{{- range $k, $v := .Values.agents.credentials.extra }}{{ $data = set $data $k $v }}{{ end }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-agent-credentials" (include "scion.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "scion.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
